<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us - CARVAN</title>

<style>
/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Poppins', sans-serif;
}

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 8%;
  background:#111; /* navbar stays dark */
  flex-wrap:wrap;
}
.logo{
  color:#ff3c00;
  font-size:24px;
  font-weight:bold;
}
.nav-links{
  list-style:none;
  display:flex;
  gap:20px;
}
.nav-links a{
  color:white;
  text-decoration:none;
  padding:8px 15px;
  transition:0.3s;
  border-radius:5px;
}
.nav-links a:hover{
  background:#ff3c00;
}

/* HERO (UPDATED IMAGE) */
.hero{
  text-align:center;
  padding:50px 20px;
  background:url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7') no-repeat center/cover;
  color:white;
  position:relative;
}
/* overlay for better text visibility */
.hero::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
}
.hero h1, .hero p{
  position:relative;
  z-index:2;
}
.hero h1{
  font-size:35px;
  margin-bottom:10px;
}
.hero p{
  color:#ddd;
}

/* SEARCH */
.search{
  text-align:center;
  margin:20px;
}
.search input{
  padding:10px;
  width:250px;
  max-width:90%;
}

/* CONTACT CARDS */
.contact-container{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  padding:30px;
}
.contact-card{
  background:#ececec;
  padding:25px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
  transition:0.3s;
}
.contact-card:hover{
  background:#d9d9d9;
  transform:translateY(-8px);
}
.contact-card h3{
  color:#ff3c00;
}

/* FORM */
.form-section{
  background:gray;
  padding:30px;
  margin:20px;
  border-radius:10px;
  box-shadow:0 8px 20px black;
}
.form-section h2{
  text-align:center;
  color:#333;
}
form{
  display:grid;
  gap:15px;
  margin-top:20px;
}
input, textarea{
  padding:10px;
  font-size:16px;
  width:100%;
}
button{
  background:red;
  color:white;
  border:none;
  padding:12px;
  cursor:pointer;
  transition:0.3s;
  border-radius:5px;
}
button:hover{
  background:#111;
}

/* MAP */
.map{
  margin:20px;
}

/* RESPONSIVE */
@media(max-width:900px){
  .contact-container{
    grid-template-columns:1fr 1fr;
  }
}
@media(max-width:600px){
  .navbar{
    flex-direction:column;
    gap:10px;
  }
  .nav-links{
    flex-direction:column;
    align-items:center;
  }
  .contact-container{
    grid-template-columns:1fr;
  }
  .hero h1{
    font-size:26px;
  }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">CARVAN</div>
  <ul class="nav-links">
    <li><a href="about.html">About Us</a></li>
    <li><a href="contact.html">Contact Us</a></li>
    <li><a href="preowned.html">PreOwned Cars</a></li>
  </ul>
</div>

<!-- HERO -->
<section class="hero">
  <h1>Contact CARVAN</h1>
  <p>We are here to help you find the best car.</p>
</section>

<!-- SEARCH -->
<div class="search">
  <input type="text" id="search" placeholder="🔍 Search Contact Info">
</div>

<!-- CONTACT CARDS -->
<section class="contact-container" id="contactCards">
  <div class="contact-card">
    <h3>📞 Phone</h3>
    <p><a href="tel:+923001234567">+92 300 1234567</a></p>
  </div>
  <div class="contact-card">
    <h3>📧 Email</h3>
    <p><a href="mailto:support@carvan.com">support@carvan.com</a></p>
  </div>
  <div class="contact-card">
    <h3>📍 Location</h3>
    <p><a href="https://www.google.com/maps?q=Karachi" target="_blank">Karachi, Pakistan</a></p>
  </div>
</section>

<!-- FORM -->
<section class="form-section">
  <h2>Send Message</h2>
  <form>
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <textarea rows="5" placeholder="Your Message"></textarea>
    <button type="submit">Send Message</button>
  </form>
</section>

<!-- MAP -->
<div class="map">
  <iframe width="100%" height="300" src="https://maps.google.com/maps?q=karachi&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
</div>

<script>
/* SEARCH FILTER */
document.getElementById("search").addEventListener("keyup", function(){
  let value = this.value.toLowerCase();
  document.querySelectorAll(".contact-card").forEach(function(card){
    let text = card.innerText.toLowerCase();
    card.style.display = text.includes(value) ? "block" : "none";
  });
});
</script>

</body>
</html>
